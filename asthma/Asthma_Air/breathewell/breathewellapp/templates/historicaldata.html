{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Historical Data - BreatheWell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #f4f6f9;
    }
    .data-card {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 40px;
    }
    .btn-group .btn {
      margin: 5px;
    }
    canvas {
      height: 400px !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="data-card">
    <h2 class="text-center mb-4">Historical Sensor Data</h2>

    <div class="text-center mb-4">
      <button class="btn btn-outline-primary active" id="btn7day">7 Days</button>
      <button class="btn btn-outline-primary" id="btn30day">30 Days</button>
    </div>

    <canvas id="healthChart"></canvas>
  </div>

</div>

<!-- Django → JavaScript Data -->
<script>
  const labels7 = {{ labels_7|safe }};
  const pm257 = {{ pm25_7|safe }};
  const hr7 = {{ hr_7|safe }};

  const labels30 = {{ labels_30|safe }};
  const pm2530 = {{ pm25_30|safe }};
  const hr30 = {{ hr_30|safe }};
</script>

<script>
  let chart;

  const chartConfig = {
    type: 'line',
    data: {},
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      scales: {
        y: {
          type: 'linear',
          position: 'left',
          title: {
            display: true,
            text: ''
          }
        },
        y1: {
          type: 'linear',
          position: 'right',
          grid: {
            drawOnChartArea: false
          },
          title: {
            display: true,
            text: 'AQ'
          }
        }
      }
    }
  };

  function renderChart(labels, pm25, hr) {
    if (chart) chart.destroy();

    chartConfig.data = {
      labels: labels,
      datasets: [
        {
          label: 'Air Quality',
          data: pm25,
          borderColor: '#0d6efd',
          tension: 0.3,
          yAxisID: 'y'
        }
    
      ]
    };

    chart = new Chart(
      document.getElementById('healthChart'),
      chartConfig
    );
  }

  // Initial load (7 days)
  renderChart(labels7, pm257, hr7);

  document.getElementById('btn7day').onclick = function () {
    setActive(this);
    renderChart(labels7, pm257, hr7);
  };

  document.getElementById('btn30day').onclick = function () {
    setActive(this);
    renderChart(labels30, pm2530, hr30);
  };

  function setActive(button) {
    document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
  }
</script>

</body>
</html>
